name: Build Rafiq Al Muslim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg service-worker.js www/
          echo '{"name":"rafiq-muslim","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          echo '{"appId":"com.rafiqalmuslim.app","appName":"رفيق المسلم","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
